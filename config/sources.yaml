# ============================================================
# AI News Hub - RSS Sources Configuration
# ============================================================
# You can add, edit, enable, or disable sources without changing Python code.
# Priority: 1 (Lowest) to 10 (Highest). Higher priority sources get higher weight in trending algorithms.

sources:
