<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <circle cx="400" cy="225" r="180" fill="url(#glowGrad)" filter="blur(40px)" />
  
  <!-- Neural Grid Nodes -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
    <line x1="280" y1="170" x2="400" y2="130" />
    <line x1="400" y1="130" x2="520" y2="170" />
    <line x1="280" y1="170" x2="330" y2="270" />
    <line x1="400" y1="130" x2="400" y2="240" />
    <line x1="520" y1="170" x2="470" y2="270" />
    <line x1="330" y1="270" x2="400" y2="240" />
    <line x1="400" y1="240" x2="470" y2="270" />
    <line x1="330" y1="270" x2="400" y2="320" />
    <line x1="470" y1="270" x2="400" y2="320" />
  </g>

  <!-- Nodes -->
  <circle cx="280" cy="170" r="6" fill="#38bdf8" />
  <circle cx="400" cy="130" r="7" fill="#60a5fa" />
  <circle cx="520" cy="170" r="6" fill="#38bdf8" />
  <circle cx="330" cy="270" r="6" fill="#a78bfa" />
  <circle cx="400" cy="240" r="9" fill="#38bdf8" />
  <circle cx="470" cy="270" r="6" fill="#a78bfa" />
  <circle cx="400" cy="320" r="6" fill="#60a5fa" />

  <text x="400" y="375" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="2">
    AI NEWS HUB &middot; INTELLIGENCE BRIEF
  </text>
</svg>
